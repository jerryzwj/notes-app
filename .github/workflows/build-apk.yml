name: build-apk

on:
  push:
    paths:
      - "public/**"
      - "android-app/package.json"
      - "android-app/scripts/**"
      - "android-app/android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: android-app
        run: npm install --no-audit --no-fund

      - name: Sync web assets into the shell
        working-directory: android-app
        run: |
          node scripts/copy-web.js
          npx cap sync android

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android-app/android assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: notes-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
